# =============================================================================
# EMB R3 OCSM – Nginx Reference Configuration (subdirectory deployment)
# =============================================================================
# ⚠️  DO NOT COPY THIS OVER THE LIVE CONFIG.
#
# The production VPS serves TWO apps from one domain, from a hand-maintained
# file at /etc/nginx/sites-available/embr3-hr-pms:
#
#     OCSM   https://embr3-onlinesystems.cloud/ocsm/    → 127.0.0.1:5001
#     HRPMS  https://embr3-onlinesystems.cloud/hrpms/   → 127.0.0.1:5000
#
# This file documents the OCSM half only. Overwriting the live config with it
# would take HRPMS offline. To change production, edit the live file and merge
# by hand:
#
#     sudo nano /etc/nginx/sites-available/embr3-hr-pms
#     sudo nginx -t && sudo systemctl reload nginx
#
# The three location blocks below match the routing that production is verified
# to serve: the SPA at /ocsm/, the API reachable at /ocsm/api/* while the
# backend itself only ever sees /api/*, and Socket.IO at /ocsm/socket.io/.
#
# Why the trailing slashes on proxy_pass matter: a proxy_pass ending in a path
# ("/api/") replaces the matched location prefix, which is what strips /ocsm
# before the request reaches Node. Removing that slash sends /ocsm/api/... to
# the backend, where no route matches and every API call 404s.
#
# The frontend must be built with the matching base path, or it will request
# assets and API routes from the wrong prefix:
#
#     cd front-end && VITE_BASE=/ocsm/ npm run build
#
# and server/.env must carry FRONTEND_BASE_PATH=/ocsm/ to match.
#
# For a single-app deployment at the domain root instead, serve the dist
# directory from `location /` and proxy `/api/` and `/socket.io/` without the
# /ocsm prefix, and build with VITE_BASE=/.
# =============================================================================

# Rate limiting: 30 requests/sec per IP, burst 20.
# Define once per http context — if the live config already has a zone named
# `api`, do not add a second one or nginx will refuse to start.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name embr3-onlinesystems.cloud;

    # Managed by certbot — do not hand-edit these paths.
    ssl_certificate     /etc/letsencrypt/live/embr3-onlinesystems.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embr3-onlinesystems.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
    gzip_min_length 1000;

    # --- OCSM API ---
    # The trailing slash on proxy_pass strips /ocsm before the backend sees it:
    #   /ocsm/api/question  →  127.0.0.1:5001/api/question
    location /ocsm/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Required: the backend runs `app.set("trust proxy", 1)` and reads the
        # client IP from this header for per-IP rate limiting. Drop it and every
        # client shares one 300-request budget.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    # --- OCSM WebSocket (Socket.IO) ---
    # The client connects with path "/ocsm/socket.io" (derived from the Vite
    # base in front-end/src/utils/socket.js), so this prefix must match.
    location /ocsm/socket.io/ {
        proxy_pass http://127.0.0.1:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- OCSM frontend (SPA static files + client-side route fallback) ---
    # `alias` (not `root`) because the URL prefix /ocsm/ is not a directory
    # inside dist/. The fallback must name the /ocsm/-prefixed URL so deep
    # links like /ocsm/survey/page1 and /ocsm/admin/dashboard reload correctly.
    location /ocsm/ {
        alias /opt/embr3-csm/front-end/dist/;
        try_files $uri $uri/ /ocsm/index.html;

        # Hashed build assets are safe to cache hard. Note this means browsers
        # keep an old bundle until its filename changes — after a deploy, test
        # with a hard refresh (Ctrl+Shift+R).
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # --- HRPMS (second app on this domain) ---
    # Left as a marker only. Copy the real blocks from the live config; they are
    # not reproduced here because this repo does not own that app.
    #
    # location /hrpms/api/   { proxy_pass http://127.0.0.1:5000/api/; ... }
    # location /hrpms/       { alias /opt/embr3-hr-pms/front-end/dist/; ... }

    # --- Block dot files (except .well-known for certbot) ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name embr3-onlinesystems.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
