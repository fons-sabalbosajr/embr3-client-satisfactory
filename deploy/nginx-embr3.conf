# =============================================================================
# EMB R3 OCSM – Nginx Reference (excerpt of the live shared config)
# =============================================================================
# ⚠️  REFERENCE ONLY — DO NOT COPY THIS FILE OVER THE LIVE CONFIG.
#
# The live file is /etc/nginx/sites-available/embr3-hr-pms and it is a SINGLE
# server block hosting SIX applications on one domain and one certificate:
#
#   /                             → 301 to /hrpms/
#   /hrpms/                       → 127.0.0.1:5000   (HRPMS)
#   /ocsm/                        → 127.0.0.1:5001   (this app)
#   /air-quality-monitoring/      → 127.0.0.1:3001   (AQM)
#   /eswm-pipeline/               → 127.0.0.1:5006   (ESWMP)
#   /iis-transaction-monitoring/  → 127.0.0.1:5100   (IIS)
#   /water-quality-monitoring/    → 127.0.0.1:5007   (WQMS)
#
# Only the OCSM blocks are reproduced below. Copying this file over the live one
# would take the other five applications offline. To change production, edit the
# live file and merge by hand:
#
#   sudo nano /etc/nginx/sites-available/embr3-hr-pms
#   sudo nginx -t && sudo systemctl reload nginx
#
# -----------------------------------------------------------------------------
# THE IMPORTANT CONSTRAINT: /api/ AT THE ROOT BELONGS TO HRPMS
# -----------------------------------------------------------------------------
# The live config maps bare `/api/` and `/socket.io/` to HRPMS on port 5000.
# So OCSM must ALWAYS be built and served under the /ocsm/ prefix. If this
# frontend is ever built with VITE_BASE=/ , its API calls go to /api/* and land
# on the HRPMS backend — requests that look like they "work" (the server is up)
# but return the wrong app's data or 404s that are hard to trace.
#
# Keep these three in agreement or OCSM breaks in confusing ways:
#
#   1. build          cd front-end && VITE_BASE=/ocsm/ npm run build
#   2. server/.env    FRONTEND_BASE_PATH=/ocsm/
#   3. nginx          the /ocsm/* locations below
#
# The frontend derives everything from the Vite base at runtime: the API base
# (/ocsm/api) in src/services/api.js, the Socket.IO path (/ocsm/socket.io) in
# src/utils/socket.js, and the React Router basename in src/main.jsx.
#
# -----------------------------------------------------------------------------
# RATE LIMIT ZONE
# -----------------------------------------------------------------------------
# The `api` zone is declared in /etc/nginx/nginx.conf at 10 r/s per IP — NOT in
# the site file. Do not declare it again here or nginx refuses to start with
# "limit_req_zone \"api\" is already bound".
#
# Note the backend applies its own, separate limit: 300 requests per 15 minutes
# per IP (express-rate-limit in server/server.js), which returns a JSON 429.
# =============================================================================


# ── Bare /ocsm → /ocsm/ (the trailing slash is required by alias) ────────────
location = /ocsm {
    return 301 /ocsm/;
}

# ── OCSM front-end (static SPA) ──────────────────────────────────────────────
# `alias`, not `root`: /ocsm/ is a URL prefix, not a directory inside dist/.
# The try_files fallback must name the /ocsm/-prefixed URL so client-side deep
# links (/ocsm/survey/page1, /ocsm/admin/dashboard) survive a reload.
location /ocsm/ {
    alias /opt/embr3-csm/front-end/dist/;
    index index.html;
    try_files $uri $uri/ /ocsm/index.html;

    # RECOMMENDED — not yet applied to the live config.
    # Without an explicit cache header, nginx serves index.html with no
    # Cache-Control and browsers fall back to heuristic caching. A stale
    # index.html still points at the PREVIOUS build's hashed bundle, so clients
    # keep running old JavaScript after a deploy even though the new files are
    # on disk. The hashed assets beside it are safe to cache; index.html is not.
    # HRPMS already does this on its own SPA block.
    #
    #   expires -1;
}

# ── OCSM API reverse proxy ───────────────────────────────────────────────────
# The trailing slash on proxy_pass ("/api/") replaces the matched location
# prefix — that is what strips /ocsm before Node sees the request:
#
#   /ocsm/api/question  →  127.0.0.1:5001/api/question
#
# Drop that slash and the backend receives /ocsm/api/question, matches no route,
# and every API call 404s.
location /ocsm/api/ {
    limit_req zone=api burst=20 nodelay;

    # RECOMMENDED — not yet applied to the live config.
    # Without this, burst overflow returns nginx's default 503 with an HTML
    # error page. The survey's submit handler has a specific, translated
    # message for 429 ("too many requests, please wait") but can only show a
    # raw status for a 503. HRPMS already sets this on its /api/ block.
    #
    #   limit_req_status 429;

    proxy_pass         http://127.0.0.1:5001/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # Required. The backend runs app.set("trust proxy", 1) and reads the client
    # IP from this header for per-IP rate limiting. Without it every client
    # shares a single 300-request budget.
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 10M;

    # RECOMMENDED — not yet applied to the live config.
    # The surrounding server block already adds these headers; helmet adds its
    # own copies in the Node app, so API responses currently carry each one
    # twice — and two CONFLICTING Referrer-Policy values (no-referrer from
    # helmet, strict-origin-when-cross-origin from nginx). HRPMS hides the
    # proxied copies; OCSM does not.
    #
    #   proxy_hide_header X-Frame-Options;
    #   proxy_hide_header X-Content-Type-Options;
    #   proxy_hide_header X-XSS-Protection;
    #   proxy_hide_header Referrer-Policy;
    #   proxy_hide_header Strict-Transport-Security;
}

# ── OCSM Socket.IO (WebSocket + long-polling) ────────────────────────────────
# The client connects with path "/ocsm/socket.io", derived from the Vite base in
# front-end/src/utils/socket.js, so this prefix must match the build.
location /ocsm/socket.io/ {
    proxy_pass         http://127.0.0.1:5001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
}
