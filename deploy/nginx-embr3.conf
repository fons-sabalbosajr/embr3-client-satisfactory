# =============================================================================
# EMB R3 OCSM – Nginx Reverse Proxy Configuration
# =============================================================================
# Installation:
#   sudo cp deploy/nginx-embr3.conf /etc/nginx/sites-available/embr3-csm
#   sudo ln -sf /etc/nginx/sites-available/embr3-csm /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# After setup, run certbot for HTTPS:
#   sudo certbot --nginx -d yourdomain.com
# =============================================================================

# Rate limiting: 30 requests/sec per IP, burst 20
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    # Replace _ with your domain (e.g., csm.emb3.gov.ph) or leave _ for IP-only
    server_name _;

    # Maximum upload size (for file uploads, if any)
    client_max_body_size 10M;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Uncomment after confirming HTTPS works:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
    gzip_min_length 1000;

    # --- Frontend (SPA static files) ---
    root /opt/embr3-csm/front-end/dist;
    index index.html;

    # --- API Proxy ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    # --- WebSocket Proxy (Socket.IO) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- SPA Fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Static Asset Caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Block dot files (except .well-known for certbot) ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
